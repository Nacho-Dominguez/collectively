<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collectively · Site comparison</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #stage, #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }

    .concept-info-button {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12);
      color: white;
      font: 600 17px/1 Georgia, serif;
      font-style: italic;
      cursor: pointer;
      transition: transform 180ms ease-out, background-color 180ms ease-out;
    }
    .concept-info-button:hover { background: rgba(35, 35, 35, 0.92); transform: translateY(-2px); }
    .concept-info-button:active { transform: scale(0.96); }
    .concept-info-button:focus-visible, .concept-info-close:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }
    .concept-info-panel {
      position: fixed;
      right: 24px;
      bottom: 72px;
      z-index: 2147483646;
      box-sizing: border-box;
      width: min(388px, calc(100vw - 48px));
      max-height: min(680px, calc(100dvh - 100px));
      overflow-y: auto;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(16, 19, 25, 0.94);
      -webkit-backdrop-filter: blur(20px) saturate(1.25);
      backdrop-filter: blur(20px) saturate(1.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.12);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .concept-info-panel[hidden] { display: none; }
    .concept-info-panel.is-opening { animation: info-enter 220ms cubic-bezier(0.23, 1, 0.32, 1) both; transform-origin: bottom right; }
    @keyframes info-enter { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
    .concept-info-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .concept-info-eyebrow { margin: 0 0 9px; color: rgba(255, 255, 255, 0.5); font-size: 11px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
    .concept-info-panel h2 { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -.035em; line-height: 1.12; }
    .concept-info-close { display: grid; place-items: center; flex: none; width: 28px; height: 28px; margin: -4px -4px 0 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font: 23px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; }
    .concept-info-close:hover { background: rgba(255,255,255,.18); }
    .concept-info-summary { margin: 18px 0 0; color: rgba(255,255,255,.83); font-size: 14px; line-height: 1.55; }
    .concept-info-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.13); }
    .concept-info-section h3 { margin: 0 0 10px; color: rgba(255,255,255,.53); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .concept-info-section p { margin: 0; color: rgba(255,255,255,.72); font-size: 13px; line-height: 1.55; }
    .concept-info-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .concept-info-tags span { padding: 6px 9px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; color: rgba(255,255,255,.8); font-size: 11px; line-height: 1; }
    .concept-info-colors { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
    .concept-info-colors span { width: 20px; height: 20px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; background: var(--swatch); }
    @media (max-width: 560px) {
      .concept-info-button { right: 16px; bottom: 80px; }
      .concept-info-panel { right: 16px; bottom: 128px; width: calc(100vw - 32px); max-height: calc(100dvh - 150px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .concept-info-button { transition: none; }
      .concept-info-panel.is-opening { animation: none; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Collectively site preview"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Aurora</button>
    <button class="proto-picker-item">Stage</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <button class="concept-info-button" type="button" aria-label="About this concept" aria-controls="concept-info-panel" aria-expanded="false">i</button>
  <aside class="concept-info-panel" id="concept-info-panel" role="dialog" aria-labelledby="concept-info-title" hidden>
    <div class="concept-info-top">
      <div>
        <p class="concept-info-eyebrow" id="concept-info-number"></p>
        <h2 id="concept-info-title"></h2>
      </div>
      <button class="concept-info-close" type="button" aria-label="Close concept information">×</button>
    </div>
    <p class="concept-info-summary" id="concept-info-summary"></p>
    <div class="concept-info-section">
      <h3>Visual language</h3>
      <p id="concept-info-visual"></p>
      <div class="concept-info-colors" id="concept-info-colors" aria-label="Key colors"></div>
      <div class="concept-info-tags" id="concept-info-tags"></div>
    </div>
    <div class="concept-info-section">
      <h3>Compared with the other direction</h3>
      <p id="concept-info-contrast"></p>
    </div>
  </aside>
  <script>
    const variants = [
      () => '<iframe src="../a/index.html" title="Aurora version of Collectively"></iframe>',
      () => '<iframe src="../b/index.html" title="Stage version of Collectively"></iframe>'
    ];
    // `variants` is an array of render functions, one per variant, in picker order.
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    const infoButton = document.querySelector('.concept-info-button');
    const infoPanel = document.querySelector('.concept-info-panel');
    const closeButton = document.querySelector('.concept-info-close');
    const conceptDetails = [
      {
        number: 'Concept 01', title: 'Aurora',
        summary: 'An inviting, atmospheric direction that makes the path from discovering a settlement to collecting feel simple and approachable.',
        visual: 'A deep navy sky opens into luminous blue and white. Soft aurora light, rounded cards, airy spacing and a magenta call to action give the page a warm, optimistic rhythm.',
        contrast: 'Where Stage organizes information into crisp editorial blocks, Aurora leads with atmosphere and a gentler, more continuous flow.',
        colors: ['#0A2A5E', '#3B97F7', '#0EBADE', '#FFFFFF', '#9B0050'],
        tags: ['Atmospheric', 'Fluid', 'Approachable', 'Rounded']
      },
      {
        number: 'Concept 02', title: 'Stage',
        summary: 'A confident, editorial direction that presents Collectively as a clear guide through a complex process.',
        visual: 'A restrained white canvas gives the typography room to lead. Deep navy sections, sharp edges, structured grids and focused blue accents create a precise, deliberate cadence.',
        contrast: 'Where Aurora softens the experience with gradients and rounded surfaces, Stage makes each message feel distinct, ordered and direct.',
        colors: ['#FFFFFF', '#031127', '#0F3A81', '#3B97F7', '#EAF4FC'],
        tags: ['Editorial', 'Structured', 'Direct', 'Confident']
      }
    ];
    let current = 0;

    function updateConceptInfo() {
      const detail = conceptDetails[current];
      document.getElementById('concept-info-number').textContent = detail.number;
      document.getElementById('concept-info-title').textContent = detail.title;
      document.getElementById('concept-info-summary').textContent = detail.summary;
      document.getElementById('concept-info-visual').textContent = detail.visual;
      document.getElementById('concept-info-contrast').textContent = detail.contrast;
      document.getElementById('concept-info-colors').innerHTML = detail.colors.map(color => `<span style="--swatch:${color}" title="${color}"></span>`).join('');
      document.getElementById('concept-info-tags').innerHTML = detail.tags.map(tag => `<span>${tag}</span>`).join('');
      infoButton.setAttribute('aria-label', `About ${detail.title}`);
    }

    function setInfoOpen(open, restoreFocus = true) {
      infoPanel.hidden = !open;
      infoButton.setAttribute('aria-expanded', String(open));
      infoPanel.classList.toggle('is-opening', open);
      if (open) closeButton.focus();
      else if (restoreFocus) infoButton.focus();
    }

    infoButton.addEventListener('click', () => setInfoOpen(infoPanel.hidden));
    closeButton.addEventListener('click', () => setInfoOpen(false));
    document.addEventListener('pointerdown', (e) => {
      if (!infoPanel.hidden && !infoPanel.contains(e.target) && !infoButton.contains(e.target)) setInfoOpen(false, false);
    });

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => {
        stage.innerHTML = variants[i]();
        stage.querySelector('iframe').addEventListener('load', (e) => {
          e.target.contentDocument?.addEventListener('keydown', handleKeydown);
        });
      });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      updateConceptInfo();
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    function handleKeydown(e) {
      if (e.key === 'Escape' && !infoPanel.hidden) { setInfoOpen(false); return; }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    }
    document.addEventListener('keydown', handleKeydown);

    const selected = parseInt(new URLSearchParams(location.search).get('v'), 10);
    setActive(selected >= 1 && selected <= variants.length ? selected - 1 : 0);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
